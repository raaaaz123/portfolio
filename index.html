<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)" />

    <title>Rasheed M — AI &amp; Full-Stack Engineer</title>
    <meta
      name="description"
      content="Software engineer building AI products, RAG systems and SaaS platforms. Selected work, experience and stack."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rasheed M — AI &amp; Full-Stack Engineer" />
    <meta
      property="og:description"
      content="Software engineer building AI products, RAG systems and SaaS platforms."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Apply the saved (or system) theme before first paint. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
